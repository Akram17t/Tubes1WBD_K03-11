# Prometheus scrape /metrics dari API (METRICS_ADDR=:9464) dan worker (METRICS_ADDR=:9465) di host.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:9464"]
  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:9465"]

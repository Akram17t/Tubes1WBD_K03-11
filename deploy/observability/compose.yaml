# Stack observability (bonus M2). Jalankan dari root repo:
#   podman-compose -f deploy/observability/compose.yaml up -d   (atau docker compose -f ...)
# API dan worker tetap jalan di host; lihat README bagian "Bonus: Observability".
services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro,z
    ports:
      - "127.0.0.1:4318:4318" # OTLP HTTP dari API dan worker; cuma loopback biar ga ada yang kirim log/trace palsu dari jaringan
    depends_on: [loki, tempo]

  loki:
    image: docker.io/grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]

  tempo:
    image: docker.io/grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0" # folder /var/tempo di image belum bisa ditulis user default
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro,z

  prometheus:
    image: docker.io/prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage # simpan trace_id dari histogram buat lompat ke Tempo
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway" # /metrics API dan worker jalan di host
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: docker.io/grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # khusus lokal/demo, jangan dipakai di production
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    ports:
      - "127.0.0.1:3000:3000" # Grafana anonymous Admin, jadi wajib loopback saja
    depends_on: [prometheus, loki, tempo]

<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Database | DB Platform</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/static/login/bootstrap-login-form.min.css" />
  </head>
  <body>
    <section class="min-vh-100" style="background-color: #508bfc">
      <div class="container py-5">
        <div class="row d-flex justify-content-center">
          <div class="col-12 col-lg-10 col-xl-8">
            <div class="card shadow-2-strong" style="border-radius: 1rem">
              <main class="card-body p-4 p-md-5">
                <h1 class="h3 mb-2">Daftar database</h1>
                <p class="text-muted mb-4">Database yang dapat Anda akses.</p>

                {{if .Databases}}
                <div class="table-responsive" role="region" aria-label="Daftar database" tabindex="0">
                  <table class="table align-middle mb-0">
                    <thead>
                      <tr>
                        <th scope="col">Nama database</th>
                        <th scope="col">Aksi</th>
                      </tr>
                    </thead>
                    <tbody>
                      {{range .Databases}}
                      <tr>
                        <td class="text-break">{{.Name}}</td>
                        <td>
                          <a
                            class="btn btn-primary btn-sm"
                            href="/databases/{{.ID}}"
                            aria-label="Buka database {{.Name}}"
                          >Buka</a>
                        </td>
                      </tr>
                      {{end}}
                    </tbody>
                  </table>
                </div>
                {{else}}
                <p class="text-muted mb-0">Belum ada database yang dapat Anda akses.</p>
                {{end}}
              </main>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="/static/login/mdb.min.js"></script>
  </body>
</html>

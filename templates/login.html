<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Login | DB Platform</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/static/login/bootstrap-login-form.min.css" />
  </head>
  <body>
    <section class="vh-100" style="background-color: #508bfc">
      <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card shadow-2-strong" style="border-radius: 1rem">
              <form
                class="card-body p-5 text-center"
                method="post"
                action="/login"
              >
                <h3 class="mb-2">Login</h3>
                <p class="text-muted mb-5">Database Management Platform</p>

                {{if .Error}}
                <div class="alert alert-danger text-start" role="alert">
                  {{.Error}}
                </div>
                {{end}}

                <div class="form-outline mb-4">
                  <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{.Username}}"
                    class="form-control form-control-lg"
                    autocomplete="username"
                    required
                    autofocus
                  />
                  <label class="form-label" for="username">Username</label>
                </div>

                <div class="form-outline mb-4">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control form-control-lg"
                    autocomplete="current-password"
                    required
                  />
                  <label class="form-label" for="password">Password</label>
                </div>

                <button class="btn btn-primary btn-lg btn-block" type="submit">
                  Login
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="/static/login/mdb.min.js"></script>
  </body>
</html>

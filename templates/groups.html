<!doctype html>
<html lang="id">
<head>
    <title>Daftar group</title>
    {{template "head"}}
</head>
<body class="bg-light">
{{template "nav" .}}
    <main class="container page">
        <h1>Daftar group</h1>
        <p><a href="/admin/groups/new">Buat group</a></p>
        {{if .Groups}}
        <table>
            <thead><tr><th scope="col">Nama</th><th scope="col">Deskripsi</th><th scope="col">Aksi</th></tr></thead>
            <tbody>
                {{range .Groups}}
                <tr>
                    <td>{{.Name}}</td>
                    <td>{{if .Description}}{{.Description}}{{else}}—{{end}}</td>
                    <td>
                        <a href="/admin/groups/{{.ID}}/edit">Edit dan kelola anggota</a>
                        <a href="/admin/groups/{{.ID}}/database-access">Akses database</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
        {{else}}
        <p>Belum ada group.</p>
        {{end}}
    </main>
</body>
</html>
